<div class="login">
    <div class="login-left">
        <h1>Abuha Messenger</h1>
        <p>Connect with friends and the world around you on Abuha messenger.</p>
    </div>
    <div class="login-right">
        <form>
            <input type="email" name="Email" class="login-input" placeholder="Email">
            <input type="password" name="Password" class="login-input" placeholder="Password">
        </form>
        <div class="login-buttons">
            <button class="btn btn-login">Login</button>
            <a href="/login/forgot-password" class="forgot-password">Forgot Password?</a>
            <button class="btn btn-create">Create a New Account</button>
        </div>
    </div>
</div>
